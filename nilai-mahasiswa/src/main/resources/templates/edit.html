<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Edit Mahasiswa</h2>

    <form th:action="@{/update/{id}(id=${mahasiswa.id})}"
          th:object="${mahasiswa}"
          method="post">

        <div class="mb-3">
            <label>NIM</label>
            <input type="text"
                   th:field="*{nim}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Nama</label>
            <input type="text"
                   th:field="*{nama}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Nilai</label>
            <input type="number"
                   th:field="*{nilai}"
                   class="form-control">
        </div>

        <button type="submit"
                class="btn btn-warning">
            Update
        </button>

        <a href="/"
           class="btn btn-secondary">
            Kembali
        </a>

    </form>

</div>

</body>
</html>
