<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sistem Nilai Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Sistem Nilai Mahasiswa</h2>

    <a href="/tambah" class="btn btn-primary mb-3">
        Tambah Mahasiswa
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>NIM</th>
            <th>Nama</th>
            <th>Nilai</th>
            <th>Grade</th>
            <th>Aksi</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="m : ${listMahasiswa}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.nim}"></td>
            <td th:text="${m.nama}"></td>
            <td th:text="${m.nilai}"></td>
            <td th:text="${m.grade}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${m.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/hapus/{id}(id=${m.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Yakin ingin menghapus data ini?')">
                    Hapus
                </a>
        </tr>


        </tbody>

    </table>

</div>

</body>
</html>
